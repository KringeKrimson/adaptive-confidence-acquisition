[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-confidence-acquisition"
version = "0.1.0"
description = "Cost-aware selective Internal Confidence acquisition for LLM cascades"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2", "transformers==4.46.3", "datasets==3.1.0",
  "accelerate==1.1.1", "numpy>=1.26,<2", "scikit-learn==1.5.2",
  "sentencepiece>=0.2,<0.3", "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
gpu = ["bitsandbytes==0.44.1"]
dev = ["pytest>=8,<9", "kaggle>=1.7,<3"]

[project.scripts]
aca = "aca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
